<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bus 26 Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>#map {height: 100vh; width: 100vw;}</style>
</head>
<body>
<div id="map"></div>

<script>
const map = L.map('map').setView([59.93, 30.31], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const markers = {};
const ws = new WebSocket("ws://localhost:8765");

ws.onmessage = (event) => {
    const buses = JSON.parse(event.data);

    buses.forEach(bus => {
        if (!markers[bus.id]) {
            markers[bus.id] = L.marker([bus.lat, bus.lon]).addTo(map);
        } else {
            markers[bus.id].setLatLng([bus.lat, bus.lon]);
        }
    });
};
</script>

</body>
</html>
